version: 0.1.0
name: step8-polishing
description: Router manifest for Step 8 polishing and revision-scope selection.

axes:
  revision_scope:
    allowed:
      - local-polish
      - section-revision
      - full-manuscript-pass
    default: local-polish
  language:
    allowed:
      - zh
      - en
      - bilingual
    default: zh
  target_genre:
    allowed:
      - thesis
      - journal
      - review
      - report
      - proposal
      - conference
      - course-paper
    default: thesis
  output_mode:
    allowed:
      - quick-polish
      - audited-polish
    default: audited-polish
  rewrite_scope:
    allowed:
      - in-place
      - bounded
      - structural
    default: bounded
  rewrite_level:
    allowed:
      - minimal
      - standard
      - aggressive
    default: standard

always_load:
  - static/core/output-contract.md
  - static/core/workflow-run-envelope.md
  - references/polish-modes.md
  - references/ai-trace-taxonomy.md
  - references/step8-rewrite-scope.md
  - references/protected-spans.md
  - references/equation-writing-contract.md
  - references/academic-ai-trace-index.md
