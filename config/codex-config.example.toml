[mcp_servers.zotero]
command = "zotero-mcp"
args = ["serve"]

[mcp_servers.zotero.env]
ZOTERO_LOCAL = "true"
# For Web API mode, set these in your shell or Codex secret store instead of
# committing them here:
# ZOTERO_API_KEY = "${ZOTERO_API_KEY}"
# ZOTERO_LIBRARY_ID = "${ZOTERO_LIBRARY_ID}"
no_proxy = "localhost,127.0.0.1,::1"
NO_PROXY = "localhost,127.0.0.1,::1"

[mcp_servers.zotero.tools.zotero_get_annotations]
approval_mode = "approve"
