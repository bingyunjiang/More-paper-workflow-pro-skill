version: 0.2.1
name: step7-writing
description: Router manifest for Step 7 writing and evidence-to-draft workflows.

axes:
  mode:
    allowed:
      - full-document
      - chapter-only
      - continue-existing
      - abstract-only
      - review-only
      - revision-only
    default: full-document
  operation:
    allowed:
      - write
      - citation-audit
      - figure
      - pre-review
    default: write
  target_genre:
    allowed:
      - thesis
      - journal
      - review
      - report
      - proposal
      - conference
      - course-paper
    default: thesis
  figure_mode:
    allowed:
      - auto_insert
      - post_write
      - skip
    default: post_write
  figure_backend:
    allowed:
      - auto
      - quick
      - reproduction
      - diagram
      - not_applicable
    default: not_applicable
  figure_asset_action:
    allowed:
      - insert_original
      - generate_new
      - redraw
      - digitize
    default: insert_original

always_load:
  - static/core/output-contract.md
  - static/core/workflow-run-envelope.md
  - references/genre-style-axis.md
  - references/writing-modes.md

mode_routes:
  full-document: references/section-blueprint-workflow.md
  chapter-only: references/section-blueprint-workflow.md
  continue-existing: references/style-learning-workflow.md
  abstract-only: references/section-blueprint-workflow.md
  review-only: references/section-blueprint-workflow.md
  revision-only: commands/revision-roadmap.md

operation_routes:
  write: references/step7-drafting-contract.md
  citation-audit: references/step7-citation-audit.md
  figure: references/step7-figure-workflow.md
  pre-review: references/step7-pre-review.md

conditional_load:
  evidence_intake:
    always: true
    paths:
      - references/step7-evidence-intake.md
  completion_validation:
    always: true
    paths:
      - references/step7-completion-validation.md
  formulas:
    triggers: [formula, equation, LaTeX, OMML, 公式, 方程]
    paths:
      - references/equation-writing-contract.md
  mechanism:
    triggers:
      - mechanism
      - 机理
      - CDRX
      - DDRX
      - DRV
      - EBSD
      - recrystallization
      - pinning
      - load transfer
    paths:
      - references/mechanism-analysis-writing-contract.md
  domain_pack:
    materials_mechanics:
      triggers: [materials, material, mechanics, EBSD, CDRX, DDRX, DRV, KAM, GOS, 热变形, 显微组织, CNT/Al]
      paths:
        - references/domain-packs/materials-mechanics-writing.md
    power_electronics_energy:
      triggers: [power electronics, energy, charging, storage, EMS, V2G, fast charging, wireless charging, 电力电子, 充电, 储能]
      paths:
        - references/domain-packs/power-electronics-ev-energy-writing.md
  journal_style:
    materials:
      triggers: [MSEA, Materials Science and Engineering A, Acta Materialia, Scripta Materialia, JMPT]
      paths:
        - references/domain-packs/materials-journal-style.md
    power_energy:
      triggers: [IEEE Transactions, IEEE Access, Applied Energy, Energy]
      paths:
        - references/domain-packs/power-energy-journal-style.md
  writing_quality:
    operations: [write, pre-review]
    paths:
      - references/writing-quality-borrowing-plan.md
      - references/style-learning-workflow.md
      - references/scientific-writing-quality-rubric.md
      - references/section-quality-gates.md
      - references/reviewer-defect-taxonomy.md
  citation_support:
    operations: [write, citation-audit, pre-review]
    paths:
      - references/citation-audit-contract.md
      - references/citation-audit-guide.md
      - references/paper-card-contract.md
      - references/claim-evidence-readiness.md
  figure_support:
    operations: [write, figure]
    paths:
      - references/figure-writing-interface.md
      - references/pdf-processing-policy.md
  section_support:
    operations: [write]
    paths:
      - references/section-blueprint-workflow.md
      - references/section-blueprint-template.md
      - references/zotero-outline-mapping.md
  revision:
    modes: [revision-only]
    operations: [pre-review]
    paths:
      - commands/revision-roadmap.md
      - references/reviewer-protocol.md
  figure_backend:
    diagram:
      backends: [diagram]
      paths:
        - references/paper-diagram-contract.md
    reproduction:
      backends: [reproduction]
      paths:
        - references/scientific-figure-reproduction.md
