version: 0.1.0
name: step7-writing
description: Router manifest for Step 7 writing and evidence-to-draft workflows.

axes:
  mode:
    allowed:
      - full-document
      - chapter-only
      - continue-existing
      - abstract-only
      - review-only
      - revision-only
    default: full-document
  operation:
    allowed:
      - write
      - citation-audit
      - figure
      - pre-review
    default: write
  target_genre:
    allowed:
      - thesis
      - journal
      - review
      - report
      - proposal
      - conference
      - course-paper
    default: thesis
  figure_mode:
    allowed:
      - auto_insert
      - post_write
      - skip
    default: post_write
  figure_backend:
    allowed:
      - auto
      - quick
      - reproduction
      - not_applicable
    default: not_applicable
  figure_asset_action:
    allowed:
      - insert_original
      - generate_new
      - redraw
      - digitize
    default: insert_original

always_load:
  - static/core/output-contract.md
  - static/core/workflow-run-envelope.md
  - references/genre-style-axis.md
  - references/writing-modes.md
  - references/equation-writing-contract.md

mode_routes:
  full-document: references/section-blueprint-workflow.md
  chapter-only: references/section-blueprint-workflow.md
  continue-existing: references/style-learning-workflow.md
  abstract-only: references/section-blueprint-workflow.md
  review-only: references/section-blueprint-workflow.md
  revision-only: commands/revision-roadmap.md

operation_routes:
  write: references/section-blueprint-workflow.md
  citation-audit: references/citation-audit-contract.md
  figure: references/figure-writing-interface.md
  pre-review: references/reviewer-protocol.md
